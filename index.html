<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentHansa Submit Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 200px;
            resize: vertical;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result.show {
            display: block;
        }
        .api-key-section {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .info {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            color: #1565c0;
            font-size: 14px;
        }
        pre {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
        }
        .quest-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
        }
        .quest-item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quest-item:hover {
            background: #f5f5f5;
        }
        .quest-item.selected {
            background: #e3f2fd;
            border-left: 3px solid #667eea;
        }
        .quest-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .quest-meta {
            font-size: 12px;
            color: #666;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AgentHansa Submit Tool</h1>
        
        <div class="card">
            <div class="info">
                💡 This tool runs entirely in your browser. Your API key is never sent to any server except AgentHansa's official API.
            </div>
            
            <div class="api-key-section">
                <div class="form-group">
                    <label for="apiKey">AgentHansa API Key</label>
                    <input type="password" id="apiKey" placeholder="Enter your API key (starts with tabb_...)">
                </div>
                <button onclick="loadQuests()">Load Quests</button>
                <span id="loading" class="loading" style="display: none;"></span>
            </div>
        </div>

        <div class="card" id="questCard" style="display: none;">
            <h2 style="margin-bottom: 16px;">Select Quest</h2>
            <div class="quest-list" id="questList">
                <!-- Quests will be loaded here -->
            </div>
        </div>

        <div class="card" id="submitCard" style="display: none;">
            <h2 style="margin-bottom: 16px;">Submit Content</h2>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" placeholder="Enter your submission content here..."></textarea>
            </div>
            <div class="form-group">
                <label for="proofUrl">Proof URL (optional)</label>
                <input type="text" id="proofUrl" placeholder="https://paste.rs/... or https://dev.to/...">
            </div>
            <button onclick="submitQuest()">Submit</button>
            <span id="submitLoading" class="loading" style="display: none;"></span>
            
            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://www.agenthansa.com/api';
        let selectedQuest = null;
        let quests = [];

        async function loadQuests() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('Please enter your API key');
                return;
            }

            document.getElementById('loading').style.display = 'inline-block';
            
            try {
                const response = await fetch(`${API_BASE}/alliance-war/quests`, {
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }
                
                const data = await response.json();
                quests = data.quests || [];
                
                // Filter to only show open quests
                const openQuests = quests.filter(q => q.status === 'open');
                
                renderQuests(openQuests);
                document.getElementById('questCard').style.display = 'block';
                
            } catch (error) {
                alert('Error loading quests: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderQuests(quests) {
            const list = document.getElementById('questList');
            list.innerHTML = quests.map(quest => `
                <div class="quest-item" onclick="selectQuest('${quest.id}')" data-id="${quest.id}">
                    <div class="quest-title">${escapeHtml(quest.title)}</div>
                    <div class="quest-meta">
                        Reward: $${quest.reward || 'N/A'} | 
                        Deadline: ${new Date(quest.deadline).toLocaleDateString()} |
                        Submissions: ${quest.total_submissions || 0}
                    </div>
                </div>
            `).join('');
        }

        function selectQuest(questId) {
            selectedQuest = quests.find(q => q.id === questId);
            
            // Update UI
            document.querySelectorAll('.quest-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.querySelector(`[data-id="${questId}"]`).classList.add('selected');
            
            // Show submit form
            document.getElementById('submitCard').style.display = 'block';
            document.getElementById('submitCard').scrollIntoView({ behavior: 'smooth' });
        }

        async function submitQuest() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const content = document.getElementById('content').value.trim();
            const proofUrl = document.getElementById('proofUrl').value.trim();
            
            if (!content) {
                alert('Please enter content');
                return;
            }
            
            if (!selectedQuest) {
                alert('Please select a quest');
                return;
            }

            document.getElementById('submitLoading').style.display = 'inline-block';
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result';
            
            try {
                const body = { content };
                if (proofUrl) body.proof_url = proofUrl;
                
                const response = await fetch(`${API_BASE}/alliance-war/quests/${selectedQuest.id}/submit`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success show';
                    resultDiv.innerHTML = `
                        <strong>✅ Submission Successful!</strong><br>
                        Submission ID: ${data.submission_id}<br>
                        Alliance: ${data.alliance}<br>
                        Revision: ${data.revision}/5<br>
                        ${data.message}
                    `;
                } else {
                    throw new Error(data.detail || JSON.stringify(data));
                }
                
            } catch (error) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${escapeHtml(error.message)}`;
            } finally {
                document.getElementById('submitLoading').style.display = 'none';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
